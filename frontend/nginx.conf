server {
  listen 8080;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://horizon-testnet.stellar.org https://soroban-testnet.stellar.org; font-src 'self'; object-src 'none'; media-src 'none'; frame-src 'none';";
  index index.html;

  location ~* \.map$ {
    deny all;
  }

  location / {
    try_files $uri $uri/ /index.html;  # SPA fallback
  }

  location /api/ {
    proxy_pass http://backend:3001;    # forward API calls to backend service
  }

  location = /health {
    proxy_pass http://backend:3001/health;
    proxy_next_upstream off;
  }
}
